services:
  postgres:
    image: postgres:14-alpine
    container_name: smartfit-postgres-user
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartfitai_users
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfit-user-service-dev
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KUMULUZEE_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/users/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_user_data:

networks:
  user-network:
    driver: bridge
